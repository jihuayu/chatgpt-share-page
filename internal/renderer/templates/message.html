{{define "message"}}
<section class="msg msg-{{.Role}}" id="{{.Anchor}}" aria-label="{{.RoleLabel}}">
  <div class="msg-head">
    <span class="msg-role {{.Role}}">{{.RoleLabel}}</span>
    <a class="msg-anchor" href="#{{.Anchor}}" aria-label="link to message">#{{.Index}}</a>
  </div>
  <div class="msg-body">
{{range .Blocks}}{{.}}
{{end}}  </div>
</section>
{{end}}
